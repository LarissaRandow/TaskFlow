name: backend

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "TaskFlow_dev_2026!"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__SigningKey: ${TASKFLOW_JWT_SIGNING_KEY:-}
      ConnectionStrings__TaskFlow: "Server=sqlserver,1433;Database=TaskFlow;User Id=sa;Password=TaskFlow_dev_2026!;Encrypt=True;TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "127.0.0.1:5004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver-data:
